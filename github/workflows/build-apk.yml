name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Unzip and Build APK
        run: |
          unzip -o NepaliChristiyaBhajan_AndroidApp.zip
          cd NepaliChristiyaBhajanApp
          gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: NepaliChristiyaBhajan-APK
          path: NepaliChristiyaBhajanApp/app/build/outputs/apk/debug/app-debug.apk
          
